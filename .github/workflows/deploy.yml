name: Deploy to Production (cPanel)

on:
  workflow_dispatch: # Manual trigger from GitHub Actions tab
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Atomic Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Frontend Dependencies & Build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.betplus.com.ng/v1
        run: |
          pnpm install --frozen-lockfile
          cd apps/web
          pnpm build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, openssl, mbstring, curl, intl, zip

      - name: Install Backend Production Dependencies
        run: |
          cd apps/platform
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare SSH Key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.CPANEL_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          echo "" >> ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.CPANEL_SSH_PORT || '22' }} -H "${{ secrets.CPANEL_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy Release via SSH & Rsync
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT || '22' }}
        run: |
          RELEASE_NAME=$(date +%Y%m%d%H%M%S)
          REMOTE_BASE="/home/$SSH_USER/betplus"
          REMOTE_RELEASE="$REMOTE_BASE/releases/$RELEASE_NAME"
          SSH_OPTS="-p $SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ServerAliveCountMax=5 -o ConnectTimeout=30"

          echo "Deploying release: $RELEASE_NAME"

          # 1. Ensure remote directories exist
          ssh $SSH_OPTS $SSH_USER@$SSH_HOST "mkdir -p $REMOTE_BASE/releases $REMOTE_BASE/shared/storage $REMOTE_BASE/shared/storage/framework/{sessions,views,cache} $REMOTE_BASE/shared/storage/logs"

          # 2. Rsync repository files (including pre-built vendor) excluding build caches
          rsync -avz --delete \
            -e "ssh $SSH_OPTS" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'apps/*/node_modules' \
            --exclude 'apps/platform/storage' \
            --exclude '.env' \
            --exclude 'apps/*/.env' \
            ./ $SSH_USER@$SSH_HOST:$REMOTE_RELEASE/

          # 3. Rsync pre-built frontend static export into the release
          rsync -avz \
            -e "ssh $SSH_OPTS" \
            ./apps/web/out/ $SSH_USER@$SSH_HOST:$REMOTE_RELEASE/apps/web/out/

          # 4. Execute atomic switch, migrations, and cache warming on server
          ssh $SSH_OPTS $SSH_USER@$SSH_HOST "bash -s" < tools/cpanel-deploy.sh
