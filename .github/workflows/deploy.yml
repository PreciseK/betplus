name: Deploy to Production (cPanel)

on:
  workflow_dispatch: # Manual trigger from GitHub Actions tab
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build & Atomic Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Frontend Dependencies & Build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.betplus.com.ng/v1
        run: |
          pnpm install --frozen-lockfile
          cd apps/web
          pnpm build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_mysql, openssl, mbstring, curl, intl, zip

      - name: Install Backend Production Dependencies
        run: |
          cd apps/platform
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare SSH Key
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.CPANEL_SSH_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          echo "" >> ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.CPANEL_SSH_PORT || '22' }} -H "${{ secrets.CPANEL_SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy Release via SSH & Rsync
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT || '22' }}
        run: |
          RELEASE_NAME=$(date +%Y%m%d%H%M%S)
          REMOTE_BASE="/home/$SSH_USER/betplus"
          REMOTE_RELEASE="$REMOTE_BASE/releases/$RELEASE_NAME"

          echo "Deploying release: $RELEASE_NAME"

          # 1. Ensure remote directories exist
          ssh -p $SSH_PORT $SSH_USER@$SSH_HOST "mkdir -p $REMOTE_BASE/releases $REMOTE_BASE/shared/storage $REMOTE_BASE/shared/storage/framework/{sessions,views,cache} $REMOTE_BASE/shared/storage/logs"

          # 2. Rsync repository files (including pre-built vendor) excluding build caches
          rsync -avz --delete \
            -e "ssh -p $SSH_PORT" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'apps/*/node_modules' \
            --exclude 'apps/platform/storage' \
            --exclude '.env' \
            --exclude 'apps/*/.env' \
            ./ $SSH_USER@$SSH_HOST:$REMOTE_RELEASE/

          # 3. Rsync pre-built frontend static export into the release
          rsync -avz \
            -e "ssh -p $SSH_PORT" \
            ./apps/web/out/ $SSH_USER@$SSH_HOST:$REMOTE_RELEASE/apps/web/out/

          # 4. Execute atomic switch, migrations, and cache warming on server
          ssh -p $SSH_PORT $SSH_USER@$SSH_HOST << 'EOF'
            set -e

            REMOTE_BASE="/home/$USER/betplus"
            RELEASE_NAME=$(ls -1 $REMOTE_BASE/releases | tail -n 1)
            CURRENT_RELEASE="$REMOTE_BASE/releases/$RELEASE_NAME"

            echo "Configuring release at $CURRENT_RELEASE"

            # Locate PHP 8.4 / 8.3 / 8.2 or cPanel ea-php binary
            PHP_BIN=""
            for candidate in \
              /usr/local/bin/ea-php84 \
              /opt/cpanel/ea-php84/root/usr/bin/php \
              /usr/local/bin/ea-php83 \
              /opt/cpanel/ea-php83/root/usr/bin/php \
              /usr/local/bin/ea-php82 \
              /opt/cpanel/ea-php82/root/usr/bin/php \
              /usr/local/bin/php \
              /usr/bin/php \
              php; do
              if command -v "$candidate" >/dev/null 2>&1; then
                VER=$("$candidate" -r 'echo PHP_VERSION_ID;' 2>/dev/null || echo 0)
                if [ "$VER" -ge 80200 ]; then
                  PHP_BIN="$candidate"
                  break
                fi
              fi
            done

            if [ -z "$PHP_BIN" ]; then
              PHP_BIN="php"
            fi

            echo "Using PHP binary: $PHP_BIN ($($PHP_BIN -v 2>/dev/null | head -n 1 || echo 'unknown'))"

            # Symlink shared .env into platform
            if [ -f "$REMOTE_BASE/shared/.env" ]; then
              ln -sfn "$REMOTE_BASE/shared/.env" "$CURRENT_RELEASE/apps/platform/.env"
            else
              echo "WARNING: $REMOTE_BASE/shared/.env does not exist yet. Please create it on the server."
            fi

            # Symlink shared storage
            ln -sfn "$REMOTE_BASE/shared/storage" "$CURRENT_RELEASE/apps/platform/storage"

            cd "$CURRENT_RELEASE/apps/platform"

            # Run database migrations
            $PHP_BIN artisan migrate --force || echo "Migrations skipped or failed, check DB connection in shared/.env"

            # Warm caches
            $PHP_BIN artisan config:cache || true
            $PHP_BIN artisan route:cache || true
            $PHP_BIN artisan view:cache || true

            # ATOMIC SWITCH: Point current to new release
            ln -sfn "$CURRENT_RELEASE" "$REMOTE_BASE/current"

            # Restart queue workers gracefully
            $PHP_BIN artisan queue:restart || true

            # Clean up old releases (keep latest 5)
            cd "$REMOTE_BASE/releases"
            ls -1t | tail -n +6 | xargs -r rm -rf

            echo "Deployment completed successfully!"
EOF
