  # numbered placeholders ("Regalia Item #N"), not actual regalia content — REQ-
  # HG-064 requires a named cultural advisor's sign-off per tradition before
  # publication, and no such review exists. Inventing 90 culturally-labelled items
  # to look finished would risk the exact harm that requirement exists to prevent;
  # every seeded item is genuinely unpublishable through the gate today, which is
  # the correct state to ship in. No back-office CRUD/publish UI or endpoints for
  # the catalogue were built this pass (scope boundary, not an oversight) —
  # HeritageCatalogueService exists and is tested, but nothing calls publish()
  # from an HTTP route yet.
  7-4-fix-the-90-item-catalogue-with-an-immutable-mapping: in-progress
  7-5-gate-catalogue-publication-on-cultural-sign-off: in-progress
  # 7-6: real. tradition/leaderType are configuration (config/heritage.php, PRD
  # §9.6's 7 launch traditions), stored on player.heritageTraditionCode/
  # heritageLeaderType, snapshotted into ticketOutcome.resultJson per ticket, and
  # structurally cosmetic — the engine never reads them for any RNG draw (asserted
  # by test_tradition_and_leader_never_affect_the_financial_outcome in both the
  # Python suite and the PHP feature test). No suggested-default/ethnicity-
