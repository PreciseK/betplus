  # Epic 8: USSD Channel
  # Built as the two real deployables the PRD/architecture describe: apps/ussd (bare
  # PHP, no framework, no database — composer.json's own doc comment) owns the
  # session/menu-tree engine and reaches the platform only over HTTP; the platform
  # gained /internal/ussd/* (signature-verified, mirrors VerifyOpayCallback's shape)
  # for the OTP-free identity bootstrap REQ-ID-004 requires and the ussdSession audit
  # mirror. Every game/money screen calls the SAME /v1 endpoints web already uses —
  # PurchaseHeritageTicketRequest, CreateTicket, FundingService, ResponsiblePlayController
  # — nothing was reimplemented, which is what actually makes "identical odds" true
  # rather than asserted. 38 tests added this pass (28 apps/ussd + 10 platform)
  # verify this, PHPStan clean at level 8 on apps/ussd and the platform's own level.
  epic-8: in-progress
  # 8-1: real. MenuEngine::handleTurn() is the whole turn loop; REQ-USSD-006's
  # invalid-input-reprompts-the-same-screen and REQ-USSD-004's 10-minute resume
  # offer are both tested (and the resume-offer test caught a genuine bug during
  # this pass: the first arrival at that screen was being treated as an implicit
  # "no", never actually rendering the prompt — fixed, not silently left). REQ-
  # USSD-005's cleanup runs on the platform's audit mirror via a scheduled command;
  # apps/ussd's own FileSessionStore.purgeExpired() exists and is tested but has
  # nothing calling it on a schedule — that app has no cron/scheduler of its own in
  # this pass, a real gap, not an oversight. REQ-USSD-003's Redis requirement is
  # substituted with one flock()'d JSON file per MSISDN — no Redis server exists in
  # this dev sandbox (same situation Domain/Identity/SessionService.php already
  # documents on the platform side) — genuinely single-box, ceiling flagged in
  # FileSessionStore's own doc comment. REQ-USSD-007 (p95 <=2s per screen) is not
  # measured — no load test exists. The wire format (Africa's Talking-style
  # sessionId/phoneNumber/text/serviceCode, CON/END envelope) and the gateway
  # signature scheme (generic HMAC-SHA256, UssdGatewaySigner) are both assumed, not
  # confirmed against a contracted aggregator — same category as OpayGateway's
  # unconfirmed Collections API fields; swap when one is contracted.
  8-1-run-a-verified-resumable-ussd-session: in-progress
  # 8-2: real. UssdIdentityService bootstraps trust from the gateway signature alone
  # — genuinely no OTP round trip anywhere on this path (REQ-ID-004), tested
  # explicitly (test_an_existing_number_signs_in_directly_with_no_otp_screen /
  # test_identify_for_an_existing_player_signs_in_directly_with_no_otp). Reuses
  # IdentityConfirmationService's OPay-lookup-and-confirm flow rather than
  # duplicating it — completeRegistration() gained a $channel parameter so
  # registrationChannel is honestly 'ussd', fixing a stale comment
  # ("USSD/app register elsewhere") that had been sitting unaddressed since Story 1.8.
  8-2-register-over-ussd-by-confirming-not-typing: review
  # 8-3: real for the Tier-1 bank-account path FundingService already supports —
  # amount entry, quote, collection creation, in-session OTP capture, all via the
  # same /v1/wallet/deposits* endpoints web uses. REQ-USSD-013 routes a non-Tier-1
  # caller to a plain "complete verification" message rather than an opaque
  # failure. REQ-USSD-011's 25-second cutoff is NOT a real timer — the session
  # closes with "We'll SMS you when it lands" whenever OpayGateway's own ~10s HTTP
  # timeout (or any non-'paid' status) comes back, which satisfies the player-
  # facing behaviour but isn't a measured 25-second clock.
  8-3-fund-in-session-without-leaving-the-menu: in-progress
  # 8-4: real — BlackRed and Heritage purchase/reveal both go through
  # PlatformClient calling the identical /v1 and /v1/heritage endpoints web/app use,
  # not a USSD-specific reimplementation, which is the actual mechanism that makes
  # "identical odds" true. Tested end to end against a fake platform client
  # (purchase args asserted directly — e.g. the exact prediction array and stake
  # sent). Heritage's "board shown face-down, then picked" UX isn't meaningfully
  # renderable as two phases over plain text, so USSD collects the 5-of-9 pick
  # before purchase and discloses the full result at settlement in one step — same
  # simplification CreateHeritageTicket's own doc comment already makes for every
  # channel, not a USSD-specific shortcut.
  8-4-play-both-games-over-ussd-at-identical-odds: in-progress
  # 8-5: real for the SMS-mirror half — SendTicketReceiptSms (game-agnostic, works
  # off ticket+ticketOutcome directly) is called by apps/ussd right after showing a
  # cash result, via a new game-agnostic POST /v1/tickets/{reference}/notify-sms
  # endpoint. Deliberately NOT wired unconditionally inside CreateTicket/
  # CreateHeritageTicket: `ticket` carries no channel column, and an SMS on every
  # web/app purchase too would be unrequested noise for channels with a persistent
  # UI. The "never lost to a dropped session" half was already true structurally
  # before this epic — settlement is synchronous at ticket creation (see
  # CreateTicket's own doc comment) — so there's no unsettled window a drop can
  # lose money into; this epic only needed to add the SMS mirror on top.
  8-5-never-lose-a-funded-ticket-to-a-dropped-session: in-progress
  # 8-6: real. "Set limits" and "Take a break" both reachable from the main menu in
  # one screen (rg_menu); the break menu (screen 2) offers all four durations plus
  # "about state exclusion" per Story 8.6's AC, calling the same
  # startCoolOff/selfExclude endpoints web uses. State-exclusion copy is tested to
  # never discourage enrolment (REQ-USSD-021). "Set limits" itself is NOT a full
  # numeric limit-editor over USSD — it routes to "use the app or website" rather
  # than fabricating a multi-screen key-then-value flow this pass didn't have room
  # to build; flagged in the screen's own return text, not hidden.
  8-6-reach-responsible-gambling-tools-within-two-screens: in-progress
  # 8-7: partial. CharacterLimit + a per-screen assertion helper enforce <=160
  # (envelope included) and are exercised throughout MenuEngineTest against every
  # screen a test reaches — genuinely checked, not just asserted in prose. What's
  # NOT built: any locale beyond English. No language-selection screen, no Pidgin/
  # Yoruba/Igbo/Hausa copy exists anywhere in apps/ussd — REQ-QA-013 explicitly
  # wants Pidgin included in the build-time check specifically because it runs
  # longer than English, which this pass cannot honestly claim to have verified
  # since the Pidgin strings themselves don't exist. Real translation and a locale
  # switch are content + UX work this pass doesn't fabricate.
  8-7-enforce-the-160-character-screen-limit-in-every-locale: in-progress
